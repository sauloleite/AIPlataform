[project]
name = "aia-fastapi"
version = "0.1.0"
description = "HTTP glue for the Python services: auth dependency, Problem Details, health"
requires-python = ">=3.12"
dependencies = [
    "aia-auth",
    "aia-errors",
    "aia-telemetry",
    "fastapi>=0.115.6",
    "pydantic-settings>=2.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aia_fastapi"]
