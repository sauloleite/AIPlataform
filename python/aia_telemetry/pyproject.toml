[project]
name = "aia-telemetry"
version = "0.1.0"
description = "OpenTelemetry with gen_ai.* conventions and aia.* attributes"
requires-python = ">=3.12"
dependencies = ["opentelemetry-api>=1.29.0", "opentelemetry-sdk>=1.29.0", "opentelemetry-exporter-otlp-proto-http>=1.29.0", "opentelemetry-instrumentation-fastapi>=0.50b0", "opentelemetry-instrumentation-httpx>=0.50b0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aia_telemetry"]
