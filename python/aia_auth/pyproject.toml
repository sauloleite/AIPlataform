[project]
name = "aia-auth"
version = "0.1.0"
description = "Local JWT validation with JWKS, Principal, RBAC and ABAC"
requires-python = ">=3.12"
dependencies = [
    "aia-contracts",
    "aia-errors",
    "pyjwt[crypto]>=2.10.1",
    # Piso explicito: versoes anteriores carregam PYSEC-2026-3552/3553/3554.
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aia_auth"]
