[project]
name = "aia-messaging"
version = "0.1.0"
description = "CloudEvents, outbox and Redis Streams publisher"
requires-python = ">=3.12"
dependencies = ["aia-errors", "redis>=5.2.1", "pymongo>=4.10.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aia_messaging"]
