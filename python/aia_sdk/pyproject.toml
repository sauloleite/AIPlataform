[project]
name = "aia-sdk"
version = "0.1.0"
description = "Cliente da API canonica da plataforma"
requires-python = ">=3.12"
dependencies = ["aia-contracts", "aia-errors", "httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aia_sdk"]
