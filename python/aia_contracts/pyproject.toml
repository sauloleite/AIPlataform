[project]
name = "aia-contracts"
version = "0.1.0"
description = "Tipos gerados a partir de contracts/openapi"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aia_contracts"]
