[project]
name = "aia-platform-python"
version = "0.1.0"
description = "AIA 2.0 OSS - Python workspace (FastAPI services and shared libraries)"
requires-python = ">=3.12"
dependencies = [
    "aia-contracts",
    "aia-auth",
    "aia-errors",
    "aia-messaging",
    "aia-resilience",
    "aia-telemetry",
    "aia-sdk",
]

[dependency-groups]
dev = [
    "ruff>=0.9.2",
    "mypy>=1.14.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "httpx>=0.28.1",
    "import-linter>=2.1",
    "testcontainers>=4.9.1",
    "schemathesis>=3.39.0",
    "types-pyyaml>=6.0.12",
]

[tool.uv.workspace]
members = ["python/*", "apps/guardrails", "apps/agent-runtime", "apps/document-processing", "apps/evaluation", "apps/data-platform"]

[tool.uv.sources]
aia-contracts = { workspace = true }
aia-auth = { workspace = true }
aia-errors = { workspace = true }
aia-messaging = { workspace = true }
aia-resilience = { workspace = true }
aia-telemetry = { workspace = true }
aia-sdk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/generated/**", "docs/reference"]
# Source roots: ruff infers what is first-party from these, so a new service
# generated by tools/generators does not require editing this configuration.
src = ["python/*/src", "apps/*/src"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # datetimes without a timezone
    "T20",       # a forgotten print
    "SIM",       # simplifications
    "ARG",       # an unused argument
    "PTH",       # pathlib
    "ASYNC",     # async pitfalls
    "S",         # bandit
    "RUF",
]
ignore = ["S101"]  # assert is valid in a test

[tool.ruff.lint.per-file-ignores]
# A CLI writes to stdout. That is what it is for.
"**/cli.py" = ["T20"]
"**/__main__.py" = ["T20"]
"**/tests/**" = ["S", "ARG", "T20"]
"**/*_test.py" = ["S", "ARG", "T20"]
"**/test_*.py" = ["S", "ARG", "T20"]

[tool.ruff.lint.isort]
known-first-party = [
    "aia_auth",
    "aia_contracts",
    "aia_errors",
    "aia_messaging",
    "aia_resilience",
    "aia_telemetry",
    "aia_sdk",
]

[tool.mypy]
python_version = "3.12"
# Os servicos usam layout src/: sem isto o mypy acha o mesmo arquivo por dois
# nomes de modulo e desiste antes de checar qualquer coisa.
mypy_path = "apps/evaluation/src:python/aia_auth/src:python/aia_contracts/src:python/aia_errors/src:python/aia_messaging/src:python/aia_resilience/src:python/aia_telemetry/src:python/aia_sdk/src:apps/guardrails/src:apps/agent-runtime/src:apps/agent-runtime/tests:apps/evaluation/tests"
explicit_package_bases = true
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
exclude = ["generated/", "docs/reference/"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "presidio_anonymizer.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python", "apps"]
# `--import-mode=importlib` deliberately does not touch sys.path, which is what
# keeps two `tests/` directories from colliding -- and also what stops a test
# importing the helper module beside it. Declaring the directories here buys
# both, in one place rather than a conftest per service.
#
# The helpers are named per service (`agent_fakes`, `evaluation_fakes`) rather
# than `fakes`: two modules with one name collide in `sys.modules` however the
# path is arranged, and the second one imported silently wins.
pythonpath = ["apps/agent-runtime/tests", "apps/evaluation/tests"]
# import-mode=importlib: without it, two `tests/` directories with the same
# module name collide during collection.
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "integration: requires containers (Testcontainers)",
    "contract: validates the service against the OpenAPI",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
