[project]
name = "evaluation"
version = "0.1.0"
description = "Evaluation: versioned datasets, evaluators and the CI regression gate."
requires-python = ">=3.12"
dependencies = [
    "aia-auth",
    "aia-errors",
    "aia-messaging",
    "aia-resilience",
    "aia-telemetry",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "httpx>=0.28.1",
    "pymongo>=4.10.1",
    "redis>=5.2.1",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
