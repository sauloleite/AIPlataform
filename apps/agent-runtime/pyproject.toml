[project]
name = "agent-runtime"
version = "0.1.0"
description = "Agent runtime. Phase 3 skeleton: LangGraph, checkpoints and HITL come later."
requires-python = ">=3.12"
dependencies = [
    "aia-auth",
    "aia-errors",
    "aia-messaging",
    "aia-resilience",
    "aia-telemetry",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]
