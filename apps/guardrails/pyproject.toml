[project]
name = "guardrails"
version = "0.1.0"
description = "Guardrails da plataforma: redacao de PII e deteccao de injecao de prompt"
requires-python = ">=3.12"
dependencies = [
    "aia-auth",
    "aia-errors",
    "aia-telemetry",
    "aia-resilience",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "presidio-analyzer>=2.2.357",
    "presidio-anonymizer>=2.2.357",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrails"]
