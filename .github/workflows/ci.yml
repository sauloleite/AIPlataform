name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ==========================================================================
  # Quality: lint, formatting and types in both ecosystems.
  # The build fails on a warning (reference doc 03 §5).
  # ==========================================================================
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen

      - name: Compile the packages
        # This has to come BEFORE ESLint: the typed rules resolve `@aia/*` through
        # the `.d.ts` files in dist/, and without them every import becomes an
        # unresolved type.
        run: pnpm exec tsc --build tsconfig.build.json

      - name: Prettier
        run: pnpm exec prettier --check .

      - name: ESLint
        run: pnpm exec eslint . --max-warnings 0

      - name: tsc (tests included)
        # `tsconfig.build.json` excludes the tests so they stay out of the image,
        # so without this step nothing typechecks a test file.
        run: pnpm exec nx run-many -t typecheck --all

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

  # ==========================================================================
  # The Clean Architecture dependency rule. It fails the build (reference doc 03 §3.1).
  # ==========================================================================
  architecture:
    name: Dependency rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-packages --frozen

      - name: dependency-cruiser (TypeScript)
        run: pnpm exec depcruise --config .dependency-cruiser.cjs --output-type err apps packages

      - name: import-linter (Python)
        run: uv run lint-imports

      - name: The rule really fails when violated
        # An architecture test that never fails protects nothing. This step
        # introduces a violation on purpose and requires depcruise to catch it.
        run: |
          set -euo pipefail
          VIOLATION=apps/inference-router/src/modules/completions/domain/__ci-violation.ts
          cat > "$VIOLATION" <<'TS'
          import { MongoAuditRepository } from '../infrastructure/mongo/audit.repository.js';
          export const x = MongoAuditRepository;
          TS
          if pnpm exec depcruise --config .dependency-cruiser.cjs --output-type err apps/inference-router; then
            rm -f "$VIOLATION"
            echo "::error::The dependency rule did NOT detect a deliberate violation."
            exit 1
          fi
          rm -f "$VIOLATION"
          echo "architecture rule confirmed"

  # ==========================================================================
  # Contracts: what is generated has to match what was committed.
  # ==========================================================================
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: The OpenAPI and AsyncAPI contracts are valid YAML
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          for path in sorted(pathlib.Path('contracts').rglob('*.yaml')):
              try:
                  yaml.safe_load(path.read_text())
              except yaml.YAMLError as error:
                  print(f"::error file={path}::{error}")
                  sys.exit(1)
              print(f"ok {path}")
          PY

      - name: Generated types are in sync with the contracts
        run: |
          node tools/scripts/generate-contracts.mjs
          if ! git diff --exit-code --stat packages/contracts/src/generated; then
            echo "::error::The generated types differ from the contracts. Run 'make contracts' and commit."
            exit 1
          fi

  # ==========================================================================
  # Unit tests: domain and application, no I/O.
  # ==========================================================================
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --build tsconfig.build.json

      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-packages --frozen

      - name: Vitest
        run: pnpm exec nx run-many -t test --all

      - name: pytest
        run: uv run pytest -m "not integration"

  # ==========================================================================
  # Integration against real dependencies in containers.
  # ==========================================================================
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MONGO_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --build tsconfig.build.json

      - name: Vitest (integration)
        run: pnpm exec vitest run --dir apps --testNamePattern "" --passWithNoTests
        env:
          RUN_INTEGRATION: '1'

  # ==========================================================================
  # End to end: brings the whole platform up and runs flow 7.1.
  # ==========================================================================
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # It starts six containers and a local model: too expensive for every docs PR.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@v4

      - name: Bring the platform up
        # The CI overlay swaps the local model for a deterministic server speaking
        # the same protocols. The production adapters remain the code under test;
        # only the dependency on the runner's hardware goes away.
        run: |
          cp .env.example .env
          docker compose \
            -f deploy/compose/docker-compose.yml \
            -f deploy/compose/docker-compose.ci.yml \
            --env-file .env up -d --build --wait --wait-timeout 600

      - name: Flow 7.1
        run: bash tools/scripts/e2e.sh
        env:
          COMPOSE_FILES: '-f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.ci.yml'

      - name: Logs on failure
        if: failure()
        run: |
          docker compose \
            -f deploy/compose/docker-compose.yml \
            -f deploy/compose/docker-compose.ci.yml logs --tail 200

  # ==========================================================================
  # Shell scripts: they are part of operations, so they get linted too.
  # ==========================================================================
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: './tools/scripts'

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm dependency update deploy/helm/aia-platform
      - run: helm lint deploy/helm/aia-platform
      - name: Render with the default values
        run: helm template aia deploy/helm/aia-platform > /dev/null
      - name: Render pointing at external dependencies
        run: |
          helm template aia deploy/helm/aia-platform \
            --set mongodb.enabled=false --set mongodb.externalUri=mongodb://external:27017 \
            --set redis.enabled=false --set redis.externalUri=redis://external:6379 \
            > /dev/null
