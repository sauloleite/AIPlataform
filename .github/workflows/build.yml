name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Needed for Cosign's keyless signing (GitHub's own OIDC).
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            dockerfile: deploy/docker/node.Dockerfile
          - service: governance
            dockerfile: deploy/docker/node.Dockerfile
          - service: inference-router
            dockerfile: deploy/docker/node.Dockerfile
          - service: guardrails
            dockerfile: deploy/docker/python.Dockerfile
          - service: registry
            dockerfile: deploy/docker/node.Dockerfile
          # One image serves the API and the ingestion worker: same build,
          # different command (`dist/worker.js`).
          - service: knowledge
            dockerfile: deploy/docker/node.Dockerfile
          - service: mcp-gateway
            dockerfile: deploy/docker/node.Dockerfile
          - service: agent-runtime
            dockerfile: deploy/docker/python.Dockerfile
          - service: evaluation
            dockerfile: deploy/docker/python.Dockerfile
          # The console has its own Dockerfile: Next builds itself, so there is
          # no `tsc --build` step and no `pnpm deploy`.
          - service: web
            dockerfile: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        # An OCI registry accepts lowercase only, and the repository name has
        # uppercase in it. Without this, Syft and Cosign fail to parse the
        # reference.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      - name: Sign the image (Cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          helm package deploy/helm/aia-platform --destination dist
          helm push dist/aia-platform-*.tgz "oci://${REGISTRY}/${GITHUB_REPOSITORY,,}/charts"
        env:
          REGISTRY: ${{ env.REGISTRY }}
