name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A new dependency with a CVE does not wait for the next PR.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          # Community rules, open source. They cover the OWASP Top 10, secrets in
          # code and security anti-patterns in TypeScript and Python.
          config: >-
            p/default
            p/typescript
            p/python
            p/owasp-top-ten
            p/secrets
            p/dockerfile

  secrets:
    name: Secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the history to scan old commits.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan the whole history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen

      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --lockfile=uv.lock
            --format=table

  containers:
    name: Image vulnerabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: inference-router
            dockerfile: deploy/docker/node.Dockerfile
          - service: identity
            dockerfile: deploy/docker/node.Dockerfile
          - service: governance
            dockerfile: deploy/docker/node.Dockerfile
          - service: guardrails
            dockerfile: deploy/docker/python.Dockerfile
          - service: web
            dockerfile: deploy/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          docker build --pull -f ${{ matrix.dockerfile }} \
            --build-arg SERVICE=${{ matrix.service }} \
            -t aia-${{ matrix.service }}:scan .

      - name: Install Trivy
        # The binary is downloaded directly, with no third-party action: the
        # version stays visible and the step does not break when a wrapper
        # changes its tag.
        run: |
          VERSION=0.74.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version

      # The binary is invoked directly rather than through the action wrapper for
      # two concrete reasons: the `trivyignores` input concatenates the files as
      # plain text and destroys the YAML format (which is what carries each
      # exception's expiry date), and the wrapper resolves relative paths from a
      # directory of its own, so the file was simply never found.
      - name: Trivy (report for code scanning)
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore.yaml" \
            --format sarif \
            --output "trivy-${{ matrix.service }}.sarif" \
            "aia-${{ matrix.service }}:scan"

      - name: Trivy (gate)
        # A vulnerability with no fix available does not block the build; what
        # blocks is one with a published patch nobody applied.
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore.yaml" \
            --exit-code 1 \
            "aia-${{ matrix.service }}:scan"

      - name: Publish to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
