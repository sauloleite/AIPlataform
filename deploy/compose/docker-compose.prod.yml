# Production overlay for self-hosting (VPS, on-premise server, homelab).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What changes relative to development:
#   - no port exposed other than Traefik's;
#   - secrets from files, never from environment variables;
#   - CPU and memory limits on every service;
#   - automatic TLS through Let's Encrypt.

services:
  # Databases and tools stop listening on the host: only the internal network reaches them.
  mongo:
    ports: !override []
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }
        reservations: { memory: 512M }

  redis:
    ports: !override []
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    deploy:
      resources:
        limits: { cpus: '1', memory: 768M }

  minio:
    ports: !override []
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets: [minio_user, minio_password]

  qdrant:
    ports: !override []

  # `GF_AUTH_ANONYMOUS_ENABLED: 'false'` used to sit here, with a comment saying
  # anonymous Grafana is acceptable in dev and not in production. It did
  # nothing: `/otel-lgtm/run-grafana.sh` in this image runs
  # `export GF_AUTH_ANONYMOUS_ENABLED=true` and `GF_AUTH_ANONYMOUS_ORG_ROLE=Admin`
  # unconditionally, after compose has set the environment and before Grafana
  # reads it. Anyone who reaches this container gets Admin, and every trace
  # carries `aia.project_id` and `aia.principal_id`.
  #
  # What actually contains it is the line below: no port is published, so only
  # the platform's own network reaches Grafana. That is a real boundary and it
  # is the only one there is -- an operator who publishes 3000 to reach a
  # dashboard has published an unauthenticated admin console, whatever the
  # environment block says.
  #
  # The admin password is still set, because that variable IS honoured and it
  # is what a person logging in over an SSH tunnel authenticates against.
  lgtm:
    ports: !override []
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
    secrets: [grafana_password]
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }

  ollama:
    ports: !override []
    deploy:
      resources:
        limits: { memory: 8G }

  traefik:
    command: !override
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entryPoint.to=websecure'
      - '--entrypoints.web.http.redirections.entryPoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.http.tls.certresolver=letsencrypt'
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json'
      - '--certificatesresolvers.letsencrypt.acme.tlschallenge=true'
      - '--accesslog=true'
      # Dashboard closed: in production it exposes the entire topology.
      - '--api.dashboard=false'
    ports: !override ['80:80', '443:443']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme

  identity:
    ports: !override []
    environment:
      NODE_ENV: production
      # Without a persisted key, restarting would invalidate every issued token.
      IDENTITY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/identity_signing_key
      IDENTITY_TOKEN_PEPPER_FILE: /run/secrets/identity_pepper
    secrets: [identity_signing_key, identity_pepper]
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  governance:
    ports: !override []
    environment: { NODE_ENV: production }
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  guardrails:
    ports: !override []
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }

  inference-router:
    ports: !override []
    environment:
      NODE_ENV: production
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [openai_api_key, gemini_api_key, anthropic_api_key]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '2', memory: 1G }

  registry:
    ports: !override []
    environment: { NODE_ENV: production }
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  knowledge:
    ports: !override []
    environment: { NODE_ENV: production }
    deploy:
      resources:
        limits: { cpus: '1', memory: 768M }

  # Its own limits, and deliberately more generous than the API's: a document
  # being embedded holds its chunks in memory, and a worker starved of it fails
  # ingestion jobs while the API next to it looks perfectly healthy.
  knowledge-worker:
    environment: { NODE_ENV: production }
    deploy:
      resources:
        limits: { cpus: '2', memory: 1G }

  mcp-gateway:
    ports: !override []
    environment: { NODE_ENV: production }
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  agent-runtime:
    ports: !override []
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  evaluation:
    ports: !override []
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

  # 3005 stays published in development so the console can be opened without
  # Traefik. In production it is a way IN that skips the TLS redirect this
  # overlay just configured -- the console answering plain HTTP on 3005 while
  # 443 enforces HTTPS.
  web:
    ports: !override []
    environment: { NODE_ENV: production }
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

secrets:
  identity_signing_key: { file: ./secrets/identity_signing_key.pem }
  identity_pepper: { file: ./secrets/identity_pepper.txt }
  minio_user: { file: ./secrets/minio_user.txt }
  minio_password: { file: ./secrets/minio_password.txt }
  grafana_password: { file: ./secrets/grafana_password.txt }
  openai_api_key: { file: ./secrets/openai_api_key.txt }
  gemini_api_key: { file: ./secrets/gemini_api_key.txt }
  anthropic_api_key: { file: ./secrets/anthropic_api_key.txt }

volumes:
  traefik-acme:
