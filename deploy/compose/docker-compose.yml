# AIA 2.0 OSS - development environment.
#
# Everything here is open source and runs with no cloud account. With no API key,
# the whole platform works through Ollama.
#
#   make dev-infra   brings up the infrastructure only
#   make dev         brings up the whole platform

name: aia

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [aia]
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-platform-env: &platform-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
  REDIS_URL: redis://redis:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  IDENTITY_ISSUER: http://identity:3001
  IDENTITY_AUDIENCE: aia-platform

x-knowledge-base: &knowledge-base
  <<: *service-defaults
  build:
    context: ../..
    dockerfile: deploy/docker/node.Dockerfile
    args: { SERVICE: knowledge }
  environment: &knowledge-env
    <<: *platform-env
    PORT: 3007
    MONGO_DATABASE: aia_knowledge
    QDRANT_URL: http://qdrant:6333
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aia}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aia-local-dev-only}
    KNOWLEDGE_BUCKET: ${KNOWLEDGE_BUCKET:-aia-documents}
    INFERENCE_ROUTER_URL: http://inference-router:3000
    EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
    # Empty until aia-document-processing exists: only text and markdown
    # parse locally, and any other type fails that one job.
    DOCUMENT_PROCESSING_URL: ${DOCUMENT_PROCESSING_URL:-}
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
    qdrant: { condition: service_healthy }
    minio: { condition: service_healthy }
    identity: { condition: service_healthy }

services:
  # ==========================================================================
  # Infrastructure
  # ==========================================================================

  mongo:
    <<: *service-defaults
    image: mongo:8.0
    # A single-node replica set: transactions and change streams require one, and
    # they are what underpins the outbox pattern (state and event in one transaction).
    command: ['--replSet', 'rs0', '--bind_ip_all', '--quiet']
    ports: ['27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    # appendonly: the budget counter survives a container restart.
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aia-local-dev-only}
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    <<: *service-defaults
    image: qdrant/qdrant:v1.12.5
    ports: ['6333:6333', '6334:6334']
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      # The image has neither curl nor wget: the binary itself answers the healthcheck.
      test: ['CMD', '/qdrant/qdrant', '--version']
      interval: 10s
      timeout: 5s
      retries: 5

  lgtm:
    <<: *service-defaults
    # Loki, Grafana, Tempo and Prometheus in one image. Traces with gen_ai.* and
    # aia.* are visible at http://localhost:3000 with no configuration at all.
    image: grafana/otel-lgtm:0.8.4
    ports:
      - '3000:3000' # Grafana
      - '3200:3200' # Tempo query API -- what the console's Traces screen reads
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    volumes: [lgtm-data:/data]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: 'true'

  ollama:
    <<: *service-defaults
    image: ollama/ollama:0.5.7
    environment:
      # Keep the model resident instead of unloading it after five minutes of
      # idleness. Reloading costs tens of seconds on CPU, and paying that on the
      # first message after a short pause makes the zero-cost local path feel
      # broken rather than slow. The memory is spent either way while anyone is
      # using the console.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    ports: ['11434:11434']
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  traefik:
    <<: *service-defaults
    # The platform's single entry point: TLS, routing and rate limiting.
    image: traefik:v3.3
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:8080'
      # The dashboard uses port 8080 by default, which here is the platform's
      # entry point: without this dedicated entrypoint the two collide on bind.
      - '--entrypoints.traefik.address=:8090'
      - '--accesslog=true'
      - '--api.dashboard=true'
      - '--api.insecure=true'
    ports: ['8080:8080', '8090:8090']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      identity: { condition: service_started }
      governance: { condition: service_started }
      inference-router: { condition: service_started }

  # ==========================================================================
  # Platform
  # ==========================================================================

  identity:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      args: { SERVICE: identity }
    environment:
      <<: *platform-env
      PORT: 3001
      MONGO_DATABASE: aia_identity
      IDENTITY_TOKEN_PEPPER: ${IDENTITY_TOKEN_PEPPER:-dev-pepper-change-in-production}
      IDENTITY_ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-3600}
      IDENTITY_BOOTSTRAP_ADMIN_EMAIL: ${IDENTITY_BOOTSTRAP_ADMIN_EMAIL:-admin@aia.local}
      IDENTITY_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
      # Credentials for the internal services. They replace the managed identity
      # a cloud would provide (ADR-012).
      IDENTITY_BOOTSTRAP_SERVICE_CLIENTS: >-
        [{"clientId":"aia-inference-router",
          "displayName":"Inference Router",
          "secret":"${ROUTER_CLIENT_SECRET:-dev-router-secret-change-in-production}",
          "scopes":["projects:read","inference:write"]},
         {"clientId":"aia-agent-runtime",
          "displayName":"Agent Runtime",
          "secret":"${AGENT_RUNTIME_CLIENT_SECRET:-dev-agent-secret-change-in-production}",
          "scopes":["projects:read","inference:write"]},
         {"clientId":"aia-registry",
          "displayName":"Registry",
          "secret":"${REGISTRY_CLIENT_SECRET:-dev-registry-secret-change-in-production}",
          "scopes":["projects:read"]}]
    ports: ['3001:3001']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.identity.rule: 'PathPrefix(`/v1/auth`) || PathPrefix(`/v1/pats`) || PathPrefix(`/v1/me`) || PathPrefix(`/.well-known`)'
      traefik.http.services.identity.loadbalancer.server.port: '3001'

  governance:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      args: { SERVICE: governance }
    environment:
      <<: *platform-env
      PORT: 3002
      MONGO_DATABASE: aia_governance
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-BRL}
    ports: ['3002:3002']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.governance.rule: 'PathPrefix(`/v1/projects`)'
      traefik.http.services.governance.loadbalancer.server.port: '3002'

  registry:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      args: { SERVICE: registry }
    environment:
      <<: *platform-env
      PORT: 3004
      MONGO_DATABASE: aia_registry
      INFERENCE_ROUTER_URL: http://inference-router:3000
      # aia-knowledge validates a store reference at publish time. Left empty,
      # an agent attaching a vector store refuses to publish rather than
      # publishing retrieval that does nothing.
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:-http://knowledge:3007}
      REGISTRY_CLIENT_ID: aia-registry
      REGISTRY_CLIENT_SECRET: ${REGISTRY_CLIENT_SECRET:-dev-registry-secret-change-in-production}
    ports: ['3004:3004']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3004/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.registry.rule: 'PathPrefix(`/v1/assets`)'
      traefik.http.services.registry.loadbalancer.server.port: '3004'

  # The image and the configuration are shared by the API and the worker. The
  # HTTP healthcheck deliberately is NOT: only the API opens a port, and a
  # worker that inherited the probe would be permanently unhealthy.
  knowledge:
    <<: *knowledge-base
    ports: ['3007:3007']
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3007/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.knowledge.rule: 'PathPrefix(`/v1/stores`)'
      traefik.http.services.knowledge.loadbalancer.server.port: '3007'

  mcp-gateway:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      args: { SERVICE: mcp-gateway }
    environment:
      <<: *platform-env
      PORT: 3006
      MONGO_DATABASE: aia_mcp_gateway
      REGISTRY_URL: http://registry:3004
      KNOWLEDGE_URL: http://knowledge:3007
      AUDIT_RETENTION_DAYS: ${TOOL_AUDIT_RETENTION_DAYS:-365}
      # Where a connection's secret is read from (ADR-015 level 2). A file with
      # mode 600 does not leak through `docker inspect` the way a variable does.
      SECRETS_DIR: /run/secrets
    ports: ['3006:3006']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity: { condition: service_healthy }
      registry: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3006/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.mcp-gateway.rule: 'PathPrefix(`/v1/tools`) || PathPrefix(`/v1/bindings`)'
      traefik.http.services.mcp-gateway.loadbalancer.server.port: '3006'

  # The same image, a second entrypoint. One dependency tree, one SBOM to sign.
  knowledge-worker:
    <<: *knowledge-base
    command: ['dist/worker.js']
    environment:
      <<: *knowledge-env
    ports: []
    # No healthcheck AT ALL, and the difference from `disable: true` matters:
    # `disable` still sets a healthcheck (test NONE), so `up --wait` finds a
    # configured check with no health state and fails the whole run with
    # "container has no healthcheck configured". Omitting the key leaves it
    # unset, and --wait then falls back to waiting for "running", which is all
    # a process with no listener can honestly report.
    labels:
      traefik.enable: 'false'
    depends_on:
      knowledge: { condition: service_healthy }

  guardrails:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args:
        SERVICE: guardrails
        # `true` downloads the spaCy model and enables person-name detection, at
        # the cost of a larger image and a slower build.
        WITH_SPACY_MODEL: ${GUARDRAILS_WITH_SPACY:-false}
    environment:
      PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DETECTOR: ${GUARDRAILS_DETECTOR:-regex}
      IDENTITY_ISSUER: http://identity:3001
      IDENTITY_AUDIENCE: aia-platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports: ['8001:8001']
    depends_on:
      identity: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health/live').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  inference-router:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      args: { SERVICE: inference-router }
    environment:
      <<: *platform-env
      PORT: 3000
      MONGO_DATABASE: aia_router
      GOVERNANCE_URL: http://governance:3002
      GUARDRAILS_URL: http://guardrails:8001
      ROUTER_CLIENT_ID: aia-inference-router
      ROUTER_CLIENT_SECRET: ${ROUTER_CLIENT_SECRET:-dev-router-secret-change-in-production}
      POLICY_CACHE_TTL_SECONDS: ${POLICY_CACHE_TTL_SECONDS:-30}
      BUDGET_UNVERIFIED_MAX_TOKENS: ${BUDGET_UNVERIFIED_MAX_TOKENS:-2000}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-BRL}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      AIA_CONTENT_CAPTURE: ${AIA_CONTENT_CAPTURE:-false}
      # Ollama needs no key: it is the default zero-cost provider.
      # Overridable, and EMPTY disables Ollama -- the same lever every other
      # provider has. On Apple Silicon the container gets no GPU and runs at
      # about one token per second, so a fallback that "works" is worse than
      # none: it answers where a hosted model failed, thirty times slower.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # External providers join on their own once the key exists.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # One key per slot; every filled one joins the rotation.
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_API_VERSION: ${GEMINI_API_VERSION:-v1beta}
      GEMINI_PROTOCOL: ${GEMINI_PROTOCOL:-generate-content}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-latest}
      GEMINI_ADVANCED_MODEL: ${GEMINI_ADVANCED_MODEL:-gemini-3-flash-preview}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-sonnet-4-5}
    ports: ['3003:3000']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity: { condition: service_healthy }
      governance: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.router.rule: 'PathPrefix(`/v1/chat`) || PathPrefix(`/v1/embeddings`) || PathPrefix(`/v1/models`)'
      traefik.http.services.router.loadbalancer.server.port: '3000'

  agent-runtime:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args: { SERVICE: agent-runtime }
    environment:
      PORT: 8002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IDENTITY_ISSUER: http://identity:3001
      IDENTITY_AUDIENCE: aia-platform
      INFERENCE_ROUTER_URL: http://inference-router:3000
      REGISTRY_URL: http://registry:3004
      MCP_GATEWAY_URL: http://mcp-gateway:3006
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: aia_agent_runtime
      REDIS_URL: redis://redis:6379
      # The ceiling on tool calls in one run. A runaway loop spends real money.
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-12}
      # The gap allowed between two chunks of a model stream. Generous because
      # a local model on a cold start is slow to its first token.
      MODEL_READ_TIMEOUT_SECONDS: ${MODEL_READ_TIMEOUT_SECONDS:-180}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports: ['8002:8002']
    depends_on:
      identity: { condition: service_healthy }
      inference-router: { condition: service_healthy }
      registry: { condition: service_healthy }
      mcp-gateway: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health/live').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Quality measured, not assumed. It runs the suites in `evals/suites` against
  # this platform, spending real inference against the caller's project.
  evaluation:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args: { SERVICE: evaluation }
    environment:
      PORT: 8003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IDENTITY_ISSUER: http://identity:3001
      IDENTITY_AUDIENCE: aia-platform
      INFERENCE_ROUTER_URL: http://inference-router:3000
      GUARDRAILS_URL: http://guardrails:8001
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: aia_evaluation
      REDIS_URL: redis://redis:6379
      SUITES_PATH: /app/evals/suites
      # The alias that GRADES. Empty by default and deliberately so: a suite
      # naming a judged evaluator then REFUSES to run, rather than scoring
      # nothing and reporting a pass nobody measured. Point it at an alias
      # other than the one under test -- a model grading itself agrees with
      # itself.
      JUDGE_ALIAS: ${JUDGE_ALIAS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    volumes:
      # The suites and datasets are versioned in Git, and read from there.
      - ../../evals:/app/evals:ro
    ports: ['8003:8003']
    depends_on:
      identity: { condition: service_healthy }
      inference-router: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health/live').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # The console. It is the only service the browser talks to: it reads the
  # httpOnly session cookie and attaches the platform token server-side, so a
  # platform JWT never exists in a browser.
  web:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      IDENTITY_URL: http://identity:3001
      GOVERNANCE_URL: http://governance:3002
      INFERENCE_ROUTER_URL: http://inference-router:3000
      REGISTRY_URL: http://registry:3004
      KNOWLEDGE_URL: http://knowledge:3007
      MCP_GATEWAY_URL: http://mcp-gateway:3006
      AGENT_RUNTIME_URL: http://agent-runtime:8002
      EVALUATION_URL: http://evaluation:8003
      # Tempo, inside the LGTM image. Empty disables the Traces screen rather
      # than breaking the console, the way a missing provider key disables one
      # provider (ADR-015's rule, applied to a read-only dependency).
      TEMPO_URL: ${TEMPO_URL:-http://lgtm:3200}
    ports: ['3005:3005']
    depends_on:
      identity: { condition: service_healthy }
      governance: { condition: service_healthy }
      inference-router: { condition: service_healthy }
      registry: { condition: service_healthy }
      knowledge: { condition: service_healthy }
      mcp-gateway: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3005/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      traefik.enable: 'true'
      # The catch-all: everything the API prefixes do not claim is the console.
      # A lower priority than the API routers keeps /v1 and /health with the
      # services that own them.
      traefik.http.routers.web.rule: 'PathPrefix(`/`)'
      # Traefik ranks by rule length by default, so the API prefixes already win
      # over `/`. Saying so explicitly means a shorter API rule added later
      # cannot silently start losing to the catch-all.
      traefik.http.routers.web.priority: '1'
      traefik.http.services.web.loadbalancer.server.port: '3005'

networks:
  aia:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  minio-data:
  qdrant-data:
  lgtm-data:
  ollama-data:
