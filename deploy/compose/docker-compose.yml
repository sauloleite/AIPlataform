# AIA 2.0 OSS - development environment.
#
# Everything here is open source and runs with no cloud account. With no API key,
# the whole platform works through Ollama.
#
#   make dev-infra   brings up the infrastructure only
#   make dev         brings up the whole platform

name: aia

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [aia]
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-platform-env: &platform-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
  REDIS_URL: redis://redis:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  IDENTITY_ISSUER: http://identity:3001
  IDENTITY_AUDIENCE: aia-platform

services:
  # ==========================================================================
  # Infrastructure
  # ==========================================================================

  mongo:
    <<: *service-defaults
    image: mongo:8.0
    # A single-node replica set: transactions and change streams require one, and
    # they are what underpins the outbox pattern (state and event in one transaction).
    command: ['--replSet', 'rs0', '--bind_ip_all', '--quiet']
    ports: ['27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    # appendonly: the budget counter survives a container restart.
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aia-local-dev-only}
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    <<: *service-defaults
    image: qdrant/qdrant:v1.12.5
    ports: ['6333:6333', '6334:6334']
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      # The image has neither curl nor wget: the binary itself answers the healthcheck.
      test: ['CMD', '/qdrant/qdrant', '--version']
      interval: 10s
      timeout: 5s
      retries: 5

  lgtm:
    <<: *service-defaults
    # Loki, Grafana, Tempo and Prometheus in one image. Traces with gen_ai.* and
    # aia.* are visible at http://localhost:3000 with no configuration at all.
    image: grafana/otel-lgtm:0.8.4
    ports:
      - '3000:3000' # Grafana
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    volumes: [lgtm-data:/data]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: 'true'

  ollama:
    <<: *service-defaults
    image: ollama/ollama:0.5.7
    environment:
      # Keep the model resident instead of unloading it after five minutes of
      # idleness. Reloading costs tens of seconds on CPU, and paying that on the
      # first message after a short pause makes the zero-cost local path feel
      # broken rather than slow. The memory is spent either way while anyone is
      # using the console.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    ports: ['11434:11434']
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  traefik:
    <<: *service-defaults
    # The platform's single entry point: TLS, routing and rate limiting.
    image: traefik:v3.3
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:8080'
      # The dashboard uses port 8080 by default, which here is the platform's
      # entry point: without this dedicated entrypoint the two collide on bind.
      - '--entrypoints.traefik.address=:8090'
      - '--accesslog=true'
      - '--api.dashboard=true'
      - '--api.insecure=true'
    ports: ['8080:8080', '8090:8090']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      identity: { condition: service_started }
      governance: { condition: service_started }
      inference-router: { condition: service_started }

  # ==========================================================================
  # Platform
  # ==========================================================================

  identity:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      args: { SERVICE: identity }
    environment:
      <<: *platform-env
      PORT: 3001
      MONGO_DATABASE: aia_identity
      IDENTITY_TOKEN_PEPPER: ${IDENTITY_TOKEN_PEPPER:-dev-pepper-change-in-production}
      IDENTITY_ACCESS_TOKEN_TTL: ${IDENTITY_ACCESS_TOKEN_TTL:-3600}
      IDENTITY_BOOTSTRAP_ADMIN_EMAIL: ${IDENTITY_BOOTSTRAP_ADMIN_EMAIL:-admin@aia.local}
      IDENTITY_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
      # Credentials for the internal services. They replace the managed identity
      # a cloud would provide (ADR-012).
      IDENTITY_BOOTSTRAP_SERVICE_CLIENTS: >-
        [{"clientId":"aia-inference-router",
          "displayName":"Inference Router",
          "secret":"${ROUTER_CLIENT_SECRET:-dev-router-secret-change-in-production}",
          "scopes":["projects:read","inference:write"]},
         {"clientId":"aia-agent-runtime",
          "displayName":"Agent Runtime",
          "secret":"${AGENT_RUNTIME_CLIENT_SECRET:-dev-agent-secret-change-in-production}",
          "scopes":["projects:read","inference:write"]}]
    ports: ['3001:3001']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.identity.rule: 'PathPrefix(`/v1/auth`) || PathPrefix(`/v1/pats`) || PathPrefix(`/v1/me`) || PathPrefix(`/.well-known`)'
      traefik.http.services.identity.loadbalancer.server.port: '3001'

  governance:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      args: { SERVICE: governance }
    environment:
      <<: *platform-env
      PORT: 3002
      MONGO_DATABASE: aia_governance
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-BRL}
    ports: ['3002:3002']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.governance.rule: 'PathPrefix(`/v1/projects`)'
      traefik.http.services.governance.loadbalancer.server.port: '3002'

  guardrails:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args:
        SERVICE: guardrails
        # `true` downloads the spaCy model and enables person-name detection, at
        # the cost of a larger image and a slower build.
        WITH_SPACY_MODEL: ${GUARDRAILS_WITH_SPACY:-false}
    environment:
      PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DETECTOR: ${GUARDRAILS_DETECTOR:-regex}
      IDENTITY_ISSUER: http://identity:3001
      IDENTITY_AUDIENCE: aia-platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports: ['8001:8001']
    depends_on:
      identity: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health/live').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  inference-router:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
      args: { SERVICE: inference-router }
    environment:
      <<: *platform-env
      PORT: 3000
      MONGO_DATABASE: aia_router
      GOVERNANCE_URL: http://governance:3002
      GUARDRAILS_URL: http://guardrails:8001
      ROUTER_CLIENT_ID: aia-inference-router
      ROUTER_CLIENT_SECRET: ${ROUTER_CLIENT_SECRET:-dev-router-secret-change-in-production}
      POLICY_CACHE_TTL_SECONDS: ${POLICY_CACHE_TTL_SECONDS:-30}
      BUDGET_UNVERIFIED_MAX_TOKENS: ${BUDGET_UNVERIFIED_MAX_TOKENS:-2000}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-BRL}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      AIA_CONTENT_CAPTURE: ${AIA_CONTENT_CAPTURE:-false}
      # Ollama needs no key: it is the default zero-cost provider.
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:1b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # External providers join on their own once the key exists.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_API_VERSION: ${GEMINI_API_VERSION:-v1beta}
      GEMINI_PROTOCOL: ${GEMINI_PROTOCOL:-generate-content}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-flash-latest}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-sonnet-4-5}
    ports: ['3003:3000']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity: { condition: service_healthy }
      governance: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.router.rule: 'PathPrefix(`/v1/chat`) || PathPrefix(`/v1/embeddings`) || PathPrefix(`/v1/models`)'
      traefik.http.services.router.loadbalancer.server.port: '3000'

  agent-runtime:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args: { SERVICE: agent-runtime }
    environment:
      PORT: 8002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IDENTITY_ISSUER: http://identity:3001
      IDENTITY_AUDIENCE: aia-platform
      INFERENCE_ROUTER_URL: http://inference-router:3000
      AGENT_RUNTIME_CLIENT_ID: aia-agent-runtime
      AGENT_RUNTIME_CLIENT_SECRET: ${AGENT_RUNTIME_CLIENT_SECRET:-dev-agent-secret-change-in-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports: ['8002:8002']
    depends_on:
      identity: { condition: service_healthy }
      inference-router: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health/live').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # The console. It is the only service the browser talks to: it reads the
  # httpOnly session cookie and attaches the platform token server-side, so a
  # platform JWT never exists in a browser.
  web:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      IDENTITY_URL: http://identity:3001
      GOVERNANCE_URL: http://governance:3002
      INFERENCE_ROUTER_URL: http://inference-router:3000
    ports: ['3005:3005']
    depends_on:
      identity: { condition: service_healthy }
      governance: { condition: service_healthy }
      inference-router: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3005/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      traefik.enable: 'true'
      # The catch-all: everything the API prefixes do not claim is the console.
      # A lower priority than the API routers keeps /v1 and /health with the
      # services that own them.
      traefik.http.routers.web.rule: 'PathPrefix(`/`)'
      # Traefik ranks by rule length by default, so the API prefixes already win
      # over `/`. Saying so explicitly means a shorter API rule added later
      # cannot silently start losing to the catch-all.
      traefik.http.routers.web.priority: '1'
      traefik.http.services.web.loadbalancer.server.port: '3005'

networks:
  aia:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  minio-data:
  qdrant-data:
  lgtm-data:
  ollama-data:
