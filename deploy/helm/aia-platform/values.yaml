# Chart default values. Everything that points outwards is replaceable.

global:
  imageRegistry: ghcr.io
  imageRepository: sauloleite/aiplataform
  imageTag: '' # vazio usa o appVersion do Chart
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Infrastructure dependencies
#
# `enabled: true` brings the component up inside the cluster (good to start with).
# `enabled: false` + `externalUri` points at an existing service.
# ---------------------------------------------------------------------------
mongodb:
  # `true` brings up a simple StatefulSet, enough to get started.
  # In production with high availability, use `false` + a dedicated operator or a
  # managed service, and set `externalUri`.
  enabled: true
  replicaCount: 1
  persistence:
    size: 20Gi
  externalUri: ''

redis:
  enabled: true
  maxmemory: 512mb
  persistence:
    size: 8Gi
  externalUri: ''

qdrant:
  enabled: false
  externalUrl: ''

minio:
  enabled: false
  externalUrl: ''

ollama:
  enabled: true
  image: ollama/ollama:0.5.7
  # Models pulled at startup. Empty pulls nothing.
  models:
    - llama3.2:1b
    - nomic-embed-text
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests: { cpu: '500m', memory: 4Gi }
    limits: { memory: 8Gi }
  # A large model usually needs a dedicated node.
  nodeSelector: {}

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
telemetry:
  # OTLP endpoint. Point it at your collector, Tempo, Jaeger or Grafana Cloud.
  otlpEndpoint: 'http://otel-collector:4318'
  contentCapture: false

# ---------------------------------------------------------------------------
# Platform services
# ---------------------------------------------------------------------------
identity:
  enabled: true
  replicaCount: 2
  port: 3001
  # A Secret holding `signing-key` (PEM PKCS#8) and `token-pepper`.
  # Without it, restarting the pod invalidates every issued token.
  existingSecret: ''
  issuer: 'http://identity:3001'
  audience: aia-platform
  accessTokenTtl: 3600
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

governance:
  enabled: true
  replicaCount: 2
  port: 3002
  defaultCurrency: BRL
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

guardrails:
  enabled: true
  replicaCount: 2
  port: 8001
  # `regex` starts instantly; `presidio` also detects person names.
  detector: regex
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 1Gi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

inferenceRouter:
  enabled: true
  replicaCount: 3
  port: 3000
  policyCacheTtlSeconds: 30
  auditRetentionDays: 90
  semanticCache:
    enabled: false
    ttlSeconds: 3600
  # A Secret holding the provider keys. A missing key disables that provider;
  # the platform keeps working through Ollama.
  providersSecret: ''
  providers:
    openai:
      baseUrl: https://api.openai.com/v1
      chatModel: gpt-4o-mini
      embeddingModel: text-embedding-3-small
    gemini:
      baseUrl: https://generativelanguage.googleapis.com
      apiVersion: v1beta
      # `generate-content` is the endpoint this adapter speaks correctly. The
      # newer `interactions` interface expects a `step_list` body for the current
      # models, which the adapter does not build yet.
      protocol: generate-content
      # An alias, not a pinned version: Google retires versioned models for new
      # keys, and a pinned default turns every fresh install into a 404.
      chatModel: gemini-flash-latest
      embeddingModel: gemini-embedding-001
    anthropic:
      baseUrl: https://api.anthropic.com
      version: '2023-06-01'
      chatModel: claude-sonnet-4-5
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

agentRuntime:
  enabled: false # Fase 3 do roadmap
  replicaCount: 1
  port: 8002
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# The console. The only service a browser talks to: it reads the httpOnly
# session cookie and attaches the platform token server-side, so a platform JWT
# never exists in a browser.
web:
  enabled: true
  replicaCount: 2
  port: 3005
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: aia.local
  annotations:
    # SSE must not be buffered: the stream would arrive as one block at the end.
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
  tls:
    enabled: false
    secretName: aia-tls

networkPolicy:
  # Denies everything by default and allows only what is needed. Leave it on.
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ['ALL']

nodeSelector: {}
tolerations: []
affinity: {}
