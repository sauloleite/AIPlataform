# Chart default values. Everything that points outwards is replaceable.

global:
  imageRegistry: ghcr.io
  imageRepository: sauloleite/aiplataform
  imageTag: '' # empty uses the Chart's appVersion
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Infrastructure dependencies
#
# `enabled: true` brings the component up inside the cluster (good to start with).
# `enabled: false` + `externalUri` points at an existing service.
# ---------------------------------------------------------------------------
mongodb:
  # `true` brings up a simple StatefulSet, enough to get started.
  # In production with high availability, use `false` + a dedicated operator or a
  # managed service, and set `externalUri`.
  enabled: true
  replicaCount: 1
  persistence:
    size: 20Gi
  externalUri: ''

redis:
  enabled: true
  maxmemory: 512mb
  persistence:
    size: 8Gi
  externalUri: ''

qdrant:
  # aia-knowledge stores every vector here (ADR-006), so it comes up with the
  # chart. `false` + `externalUrl` points at Qdrant Cloud or an existing cluster.
  enabled: true
  persistence:
    size: 20Gi
  externalUrl: ''

minio:
  # Uploaded documents live here until they are parsed. `false` + `externalUrl`
  # points at S3, GCS or Blob through their S3-compatible endpoint.
  enabled: true
  persistence:
    size: 20Gi
  # A Secret holding `root-user` and `root-password`. Generated if empty, which
  # is fine for a trial and not for production.
  existingSecret: ''
  bucket: aia-documents
  externalUrl: ''

ollama:
  enabled: true
  image: ollama/ollama:0.5.7
  # Models pulled at startup. Empty pulls nothing.
  models:
    - llama3.2:1b
    - nomic-embed-text
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests: { cpu: '500m', memory: 4Gi }
    limits: { memory: 8Gi }
  # A large model usually needs a dedicated node.
  nodeSelector: {}

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
telemetry:
  # OTLP endpoint. Point it at your collector, Tempo, Jaeger or Grafana Cloud.
  otlpEndpoint: 'http://otel-collector:4318'
  contentCapture: false

# ---------------------------------------------------------------------------
# Platform services
# ---------------------------------------------------------------------------
identity:
  enabled: true
  replicaCount: 2
  port: 3001
  # A Secret holding `signing-key` (PEM PKCS#8) and `token-pepper`.
  # Without it, restarting the pod invalidates every issued token.
  existingSecret: ''
  issuer: 'http://identity:3001'
  audience: aia-platform
  accessTokenTtl: 3600
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

governance:
  enabled: true
  replicaCount: 2
  port: 3002
  defaultCurrency: BRL
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

guardrails:
  enabled: true
  replicaCount: 2
  port: 8001
  # `regex` starts instantly; `presidio` also detects person names.
  detector: regex
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 1Gi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

inferenceRouter:
  enabled: true
  replicaCount: 3
  port: 3000
  policyCacheTtlSeconds: 30
  auditRetentionDays: 90
  semanticCache:
    enabled: false
    ttlSeconds: 3600
  # A Secret holding the provider keys. A missing key disables that provider;
  # the platform keeps working through Ollama.
  providersSecret: ''
  providers:
    openai:
      baseUrl: https://api.openai.com/v1
      chatModel: gpt-4o-mini
      embeddingModel: text-embedding-3-small
    gemini:
      baseUrl: https://generativelanguage.googleapis.com
      apiVersion: v1beta
      # `generate-content` is the endpoint this adapter speaks correctly. The
      # newer `interactions` interface expects a `step_list` body for the current
      # models, which the adapter does not build yet.
      protocol: generate-content
      # An alias, not a pinned version: Google retires versioned models for new
      # keys, and a pinned default turns every fresh install into a 404.
      chatModel: gemini-flash-latest
      # A different, stronger model for `chat-advanced` -- and the evaluation
      # judge, which must not be the model under test.
      advancedModel: gemini-3-flash-preview
      embeddingModel: gemini-embedding-001
    anthropic:
      baseUrl: https://api.anthropic.com
      version: '2023-06-01'
      chatModel: claude-sonnet-4-5
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

registry:
  enabled: true
  replicaCount: 2
  port: 3004
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

knowledge:
  enabled: true
  replicaCount: 2
  port: 3007
  embeddingBatchSize: 32
  # Empty until aia-document-processing exists (roadmap M7): only text, markdown
  # and JSON parse locally, and any other media type fails that one job.
  documentProcessingUrl: ''
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# The ingestion worker: same image, no HTTP listener.
#
# Separate from `knowledge` because it scales on queue depth rather than on
# request rate, and because a slow ingestion must never make the search API
# unavailable. Enabling knowledge without this leaves uploads queued forever.
knowledgeWorker:
  enabled: true
  replicaCount: 1
  concurrency: 4
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 1Gi }

mcpGateway:
  enabled: true
  replicaCount: 2
  port: 3006
  auditRetentionDays: 365
  # A Secret mounted at /run/secrets, holding one file per tool credential
  # referenced by a Connection (ADR-015, ADR-020).
  toolSecretsSecret: ''
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

agentRuntime:
  enabled: true
  replicaCount: 2
  port: 8002
  maxSteps: 12
  modelReadTimeoutSeconds: 180
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

evaluation:
  enabled: true
  replicaCount: 1
  port: 8003
  # The judge must not be the model under test. Empty means judged suites refuse
  # to run rather than score themselves (ADR-021).
  judgeAlias: ''
  suitesPath: /app/evals/suites
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# The console. The only service a browser talks to: it reads the httpOnly
# session cookie and attaches the platform token server-side, so a platform JWT
# never exists in a browser.
web:
  enabled: true
  replicaCount: 2
  port: 3005
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
networking:
  # `gateway` renders a Gateway plus an HTTPRoute; `ingress` renders the older
  # Ingress. Kubernetes froze the Ingress API and ingress-nginx was retired in
  # March 2026 with no further security patches, so the Gateway API is the
  # default -- switch back only for a cluster with no Gateway controller.
  mode: gateway
  gatewayClassName: nginx
  # An answer streams over minutes. The default would cut it mid-generation.
  requestTimeout: 600s

ingress:
  # Read only when networking.mode is `ingress`.
  className: nginx
  host: aia.local
  annotations:
    # SSE must not be buffered: the stream would arrive as one block at the end.
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
  tls:
    enabled: false
    secretName: aia-tls

networkPolicy:
  # Denies everything by default and allows only what is needed. Leave it on.
  enabled: true
  # Which namespace is allowed to reach the platform from outside. Kubernetes
  # labels every namespace with its own name, so this works untouched for
  # ingress-nginx, and takes one edit for a Gateway controller elsewhere.
  edgeNamespaceLabel:
    key: kubernetes.io/metadata.name
    value: ingress-nginx

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ['ALL']

nodeSelector: {}
tolerations: []
affinity: {}
