{{/*
MongoDB, Redis and Ollama as our own StatefulSets.

Self-contained on purpose: the chart does not depend on a third-party repository
whose image policy can change without notice (ADR-012).

These manifests are for GETTING STARTED. For production with high availability,
switch them off (`mongodb.enabled=false`) and point at a dedicated operator or a
managed service — `externalUri` exists for exactly that.
*/}}

{{- if .Values.mongodb.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mongodb
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  serviceName: {{ .Release.Name }}-mongodb-headless
  replicas: {{ .Values.mongodb.replicaCount }}
  selector:
    matchLabels:
      {{- include "aia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mongodb
  template:
    metadata:
      labels:
        {{- include "aia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:8.0
          # A replica set even with one node: multi-document transactions need
          # one, and they are what underpins the outbox pattern (ADR-007).
          args: ['--replSet', 'rs0', '--bind_ip_all']
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - |
                  try { rs.status().ok }
                  catch { rs.initiate({_id:'rs0',members:[{_id:0,host:'{{ .Release.Name }}-mongodb-0.{{ .Release.Name }}-mongodb-headless:27017'}]}).ok }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size | default "20Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mongodb-headless
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  # Headless: the replica set needs stable per-pod DNS.
  clusterIP: None
  ports:
    - port: 27017
      targetPort: mongodb
      name: mongodb
  selector:
    {{- include "aia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
{{- end }}

{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ .Release.Name }}-redis-master
  replicas: 1
  selector:
    matchLabels:
      {{- include "aia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "aia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - redis-server
            # appendonly: the budget counter survives a restart.
            - --appendonly
            - 'yes'
            - --maxmemory
            - {{ .Values.redis.maxmemory | default "512mb" | quote }}
            # noeviction on purpose: silently evicting a budget counter would
            # be worse than failing visibly.
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size | default "8Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis-master
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "aia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}

{{- if .Values.ollama.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aia.fullname" . }}-ollama
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  serviceName: {{ include "aia.fullname" . }}-ollama
  replicas: 1
  selector:
    matchLabels:
      {{- include "aia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "aia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      # The Ollama image writes to /root/.ollama by default, which would require
      # root. `OLLAMA_MODELS` and `HOME` move the state onto the volume, so this
      # pod runs unprivileged like every other one.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.ollama.models }}
      initContainers:
        # Baixa os modelos antes de servir: sem isso a primeira requisicao
        # espera o download inteiro e estoura o timeout do router.
        - name: pull-models
          image: {{ .Values.ollama.image }}
          env:
            - name: HOME
              value: /data
            - name: OLLAMA_MODELS
              value: /data/models
          command:
            - sh
            - -c
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              {{- range .Values.ollama.models }}
              ollama pull {{ . }}
              {{- end }}
              kill %1
          volumeMounts:
            - name: models
              mountPath: /data
      {{- end }}
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          env:
            - name: HOME
              value: /data
            - name: OLLAMA_MODELS
              value: /data/models
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            exec:
              command: ['ollama', 'list']
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: models
              mountPath: /data
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: {{ .Values.ollama.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aia.fullname" . }}-ollama
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  ports:
    - port: 11434
      targetPort: http
      name: http
  selector:
    {{- include "aia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}

{{/*
Qdrant and MinIO.

aia-knowledge cannot start without either: every vector goes to Qdrant (ADR-006)
and every uploaded document to MinIO. They used to default to `enabled: false`
with no manifest behind them, which meant enabling knowledge produced a service
pointing at an address nothing served.

Single replica, as with Mongo and Redis above: this is the getting-started
shape. Production runs a Qdrant cluster and real object storage, which is what
`externalUrl` is for.
*/}}
{{- if .Values.qdrant.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aia.fullname" . }}-qdrant
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "aia.fullname" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      {{- include "aia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        {{- include "aia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: qdrant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.5
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: {{ .Values.qdrant.persistence.size | default "20Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aia.fullname" . }}-qdrant
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  ports:
    - { port: 6333, targetPort: http, name: http }
    - { port: 6334, targetPort: grpc, name: grpc }
  selector:
    {{- include "aia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
{{- end }}

{{- if .Values.minio.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aia.fullname" . }}-minio
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "aia.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "aia.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "aia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          args: ['server', '/data', '--console-address', ':9001']
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            {{- if .Values.minio.existingSecret }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.minio.existingSecret }}, key: root-user }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.minio.existingSecret }}, key: root-password }
            {{- else }}
            {{/*
              A known credential, and it is meant to look like one. Anything
              generated here would be regenerated on every `helm upgrade` and
              would lock the platform out of its own bucket. Set
              `minio.existingSecret` before this holds anything real.
            */}}
            - name: MINIO_ROOT_USER
              value: aia
            - name: MINIO_ROOT_PASSWORD
              value: aia-local-dev-only
            {{- end }}
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size | default "20Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aia.fullname" . }}-minio
  labels:
    {{- include "aia.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  ports:
    - { port: 9000, targetPort: api, name: api }
    - { port: 9001, targetPort: console, name: console }
  selector:
    {{- include "aia.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
{{- end }}
