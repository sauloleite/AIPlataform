apiVersion: v2
name: aia-platform
description: |
  AIA 2.0 OSS - an enterprise AI platform, cloud-agnostic.
  Runs on any Kubernetes: k3s, kind, EKS, GKE, AKS or on-premise.
type: application
version: 0.1.0
appVersion: '0.1.0'
keywords: [ai, llm, gateway, governance, open-source]
home: https://github.com/sauloleite/AIPlataform
sources:
  - https://github.com/sauloleite/AIPlataform

# No external chart dependencies.
#
# MongoDB and Redis come as our own simple StatefulSets, so the chart is
# self-contained and does not depend on a third-party repository whose image
# policy can change (ADR-012 - vendor independence applies here too).
#
# For PRODUCTION, prefer `mongodb.enabled=false` / `redis.enabled=false` with a
# dedicated operator or a managed service: the StatefulSets here are for getting
# started, not for operating a highly available cluster.
