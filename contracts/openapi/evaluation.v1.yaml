openapi: 3.1.0
info:
  title: AIA Evaluation
  version: '1.0.0'
  description: |
    Quality measured, not assumed (reference doc 02, principle 10).

    A suite says WHAT to measure and WHERE the failing threshold sits. Running
    one answers with the numbers and with a verdict CI can act on.

    Two kinds of bad run, deliberately distinct. A run that **failed** measured
    everything and fell below a threshold — that is quality regressing, and the
    prompts are the place to look. A run that **errored** did not measure what
    it claimed: a case fell over, or a judged evaluator had no judge. Reporting
    the second as the first sends people to debug a model that was never asked.
  license: { name: MIT }

servers:
  - url: http://localhost:8080
    description: Local environment (docker-compose)

security:
  - bearerAuth: []

tags:
  - name: evaluation
    description: Suites, runs and the regression gate

paths:
  /v1/evaluations:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/ProjectId'
    post:
      operationId: runEvaluation
      tags: [evaluation]
      summary: Runs the suites and reports what they measured
      description: |
        Synchronous, because a caller running a gate wants the verdict, not a
        job id to poll. It spends real inference against this project's budget.

        The status IS the gate: `202` when everything held, `409` when anything
        did not. A caller that reads nothing but the status still learns whether
        to stop the merge.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunRequest' }
      responses:
        '202':
          description: Every suite passed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '409':
          description: A suite failed its threshold, or a run did not measure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
    get:
      operationId: listEvaluations
      tags: [evaluation]
      summary: Recent runs for this project
      description: |
        History is the point. A number nobody kept is an opinion again next
        week, and a threshold only means something next to what it used to be.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: The runs, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }

  /v1/evaluations/{runId}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/ProjectId'
      - name: runId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvaluation
      tags: [evaluation]
      summary: One run, with the answers behind the numbers
      description: |
        A score that dropped is only actionable next to the answers that
        produced it. A run from another project answers 404, never 403.
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }

  /v1/annotations:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/ProjectId'
    post:
      operationId: recordAnnotation
      tags: [evaluation]
      summary: Records what a person decided about one real trace
      description: |
        Error analysis, made durable. Reading traces and naming what went wrong
        is what produces a failure taxonomy; an evaluator written before that
        measures what its author imagined rather than what the platform does.

        The failure mode is free text, normalised to a slug. It is deliberately
        not an enum: an enum decided up front is the same guess in a different
        place, and the taxonomy this returns is the one the traces produced.

        An annotation that carries the question and the answer, and names the
        evaluator that should have caught the problem, is also a human LABEL —
        which is what a judge is calibrated against (ADR-028).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnotationRequest' }
      responses:
        '201':
          description: The annotation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Annotation' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
    get:
      operationId: listAnnotations
      tags: [evaluation]
      summary: The annotations for this project, and the taxonomy they add up to
      description: |
        The counts are the point of the endpoint. A failure mode nobody has
        seen twice is an anecdote; one that appears in a third of the annotated
        traces is the next evaluator to write.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Limit'
        - name: trace_id
          in: query
          required: false
          schema: { type: string }
          description: Only the annotations on this trace.
        - name: failure_mode
          in: query
          required: false
          schema: { type: string }
          description: Only this failure mode, normalised the same way it is stored.
      responses:
        '200':
          description: The annotations, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnotationPage' }

  /v1/samples:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/ProjectId'
    get:
      operationId: listSamples
      tags: [evaluation]
      summary: Production calls scored after the fact, and what they add up to
      description: |
        A suite measures the platform against questions somebody wrote down.
        Production asks different questions, in a different distribution, and it
        keeps changing — so a suite that passed last night says nothing about
        the traffic that arrived this afternoon.

        The sampler scores a deterministic fraction of completed calls. It is
        off by default: sampling spends inference on real traffic and reads what
        real people wrote.

        `unscorable` is reported beside the means rather than subtracted from
        them. The commonest reason is a project that does not capture content,
        and a summary that quietly dropped those would look like a healthy
        measurement of a tenth of the traffic.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: The samples, newest first, with the summary over them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplePage' }

  /health/live:
    get:
      operationId: evaluationLive
      tags: [evaluation]
      summary: Liveness
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /health/ready:
    get:
      operationId: evaluationReady
      tags: [evaluation]
      summary: Readiness
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        '503': { $ref: './_shared.yaml#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    bearerAuth: { $ref: './_shared.yaml#/components/securitySchemes/bearerAuth' }

  schemas:
    RunStatus:
      type: string
      description: |
        `failed` is quality below a threshold. `errored` is a measurement that
        did not happen. Both stop a merge; only one is about the model.
      enum: [running, passed, failed, errored]

    RunRequest:
      type: object
      properties:
        suite:
          type: string
          description: A suite file or a directory of them. Defaults to the configured path.
        alias:
          type: string
          description: |
            Overrides the alias every suite names. What a model-regression run
            does before an alias's deployment is swapped.

    Metric:
      type: object
      required: [evaluator, value, passed, sample_size]
      properties:
        evaluator:
          type: string
          enum: [groundedness, relevance, safety, exact_match, cost_per_answer, latency_p95]
        value: { type: number }
        threshold:
          type: [number, 'null']
          description: The floor a score has to reach.
        maximum:
          type: [number, 'null']
          description: The ceiling a cost or a latency has to stay under.
        passed: { type: boolean }
        sample_size:
          type: integer
          minimum: 0
          description: |
            How many cases contributed. Zero never passes: an evaluator that
            scored nothing has measured nothing, and an average over an empty
            set reads as a comfortable zero.

    Run:
      type: object
      required: [id, project_id, suite, alias, status, metrics, started_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        suite: { type: string }
        alias: { type: string }
        principal_id: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        error_code: { type: [string, 'null'] }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/Metric' }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          properties:
            cases:
              type: array
              items: { $ref: '#/components/schemas/CaseOutcome' }

    CaseOutcome:
      type: object
      required: [case_id, input]
      properties:
        case_id: { type: string }
        input: { type: string }
        answer: { type: [string, 'null'] }
        error_code:
          type: [string, 'null']
          description: Present when the case never got an answer. A hole, not a zero.
        scores:
          type: object
          additionalProperties: { type: number }

    AnnotationVerdict:
      type: string
      description: |
        What the person decided about the answer. Binary on purpose: a
        three-point scale collects the middle, and the middle is where
        disagreement hides rather than being resolved.
      enum: [good, bad]

    AnnotationRequest:
      type: object
      required: [trace_id, verdict]
      properties:
        trace_id: { type: string }
        verdict: { $ref: '#/components/schemas/AnnotationVerdict' }
        failure_mode:
          type: string
          description: |
            Required when the verdict is `bad`, and refused when it is `good`.
            "It was wrong" that does not say how is the annotation that teaches
            nobody anything.
        note: { type: string }
        evaluator:
          type: string
          description: |
            Which evaluator should have caught this, if one could have. Optional,
            and it is the field that turns an annotation into a calibration
            label — which is why it is asked here rather than inferred later.
          enum: [groundedness, relevance]
        question: { type: string }
        answer: { type: string }
        context:
          type: array
          items: { type: string }
          description: |
            What the answer was supposed to be grounded in. Present only when
            the annotator had it: content capture is per project and off by
            default, so an annotation frequently carries a verdict and no text.

    Annotation:
      type: object
      required: [id, project_id, trace_id, verdict, principal_id, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        trace_id: { type: string }
        verdict: { $ref: '#/components/schemas/AnnotationVerdict' }
        failure_mode: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        evaluator: { type: [string, 'null'] }
        question: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        context:
          type: array
          items: { type: string }
        principal_id:
          type: string
          description: Who decided. An unattributed label has no authority.
        created_at: { type: string, format: date-time }
        is_label:
          type: boolean
          description: |
            Whether this annotation can be used to calibrate a judge: it needs
            an evaluator, a question and an answer. False is the common case and
            not a defect.

    FailureModeCount:
      type: object
      required: [failure_mode, count]
      properties:
        failure_mode: { type: string }
        count: { type: integer, minimum: 1 }

    AnnotationPage:
      type: object
      required: [items, taxonomy]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Annotation' }
        taxonomy:
          type: array
          description: Every failure mode seen in this project, commonest first.
          items: { $ref: '#/components/schemas/FailureModeCount' }
        next_cursor: { type: [string, 'null'] }

    Sample:
      type: object
      required: [id, project_id, request_id, alias, sampled_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        request_id:
          type: string
          description: The call this scored. `GET /v1/completions/{requestId}` has what it said.
        alias: { type: string }
        scores:
          type: object
          additionalProperties: { type: number }
        unscorable:
          type: [string, 'null']
          description: |
            Why nothing was scored. A hole in the measurement, never a zero — a
            zero here would read as the platform producing terrible answers.
        judge_alias: { type: [string, 'null'] }
        sampled_at: { type: string, format: date-time }

    EvaluatorSummary:
      type: object
      required: [evaluator, mean, sample_size]
      properties:
        evaluator: { type: string }
        mean: { type: number }
        sample_size:
          type: integer
          minimum: 0
          description: A mean over four calls is an anecdote with a decimal point.

    SamplePage:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Sample' }
        summary:
          type: object
          required: [evaluators, scored, unscorable]
          properties:
            evaluators:
              type: array
              items: { $ref: '#/components/schemas/EvaluatorSummary' }
            scored: { type: integer, minimum: 0 }
            unscorable: { type: integer, minimum: 0 }
        next_cursor: { type: [string, 'null'] }

    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        next_cursor: { type: [string, 'null'] }
