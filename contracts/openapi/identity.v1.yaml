openapi: 3.1.0
info:
  title: AIA Identity
  version: '1.0.0'
  description: |
    The platform identity issuer. No dependency on any cloud IdP: it mints its
    own RS256 JWTs and publishes the public keys as JWKS, so every service
    validates the token LOCALLY (ADR-004) and identity stays off the critical
    path. An external OIDC (Keycloak, Google, Auth0) can be plugged in.
  license: { name: MIT }

servers:
  - url: http://localhost:8080

tags:
  - name: auth
  - name: tokens

paths:
  /v1/auth/token:
    post:
      operationId: issueToken
      tags: [auth]
      summary: Issues an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PasswordGrant'
                - $ref: '#/components/schemas/ClientCredentialsGrant'
              discriminator: { propertyName: grant_type }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }

  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [auth]
      summary: Public keys for local JWT validation
      security: []
      responses:
        '200':
          description: The key set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /.well-known/openid-configuration:
    get:
      operationId: getOidcDiscovery
      tags: [auth]
      summary: OIDC discovery document
      security: []
      responses:
        '200':
          description: Issuer metadata
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /v1/auth/introspect:
    post:
      operationId: introspectToken
      tags: [auth]
      summary: Introspects an opaque token (PAT)
      description: |
        PATs only. A JWT does not come through here: it is validated locally
        against the JWKS. The result is cached for 60 s (ADR-004).
      responses:
        '200':
          description: The introspection result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Introspection' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }

  /v1/me:
    get:
      operationId: getCurrentPrincipal
      tags: [auth]
      summary: Returns the principal of the current token
      responses:
        '200':
          description: The principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }

  /v1/pats:
    post:
      operationId: createPat
      tags: [tokens]
      summary: Creates a Personal Access Token
      description: |
        The value is returned in this response only; the platform stores just the hash.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, project_id]
              properties:
                name: { type: string, minLength: 3, maxLength: 64 }
                project_id: { type: string }
                scopes: { type: array, items: { type: string } }
                expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '201':
          description: PAT created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatCreated' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
    get:
      operationId: listPats
      tags: [tokens]
      summary: Lists the principal PATs (without the value)
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: A page of PATs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Pat' } }

  /v1/pats/{patId}:
    delete:
      operationId: revokePat
      tags: [tokens]
      summary: Revokes a PAT
      parameters:
        - name: patId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }

  /health/live:
    get:
      operationId: liveness
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /health/ready:
    get:
      operationId: readiness
      security: []
      summary: Readiness probe
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        '503': { $ref: './_shared.yaml#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PasswordGrant:
      type: object
      required: [grant_type, username, password]
      properties:
        grant_type: { type: string, const: password }
        username: { type: string }
        password: { type: string, format: password }

    ClientCredentialsGrant:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type: { type: string, const: client_credentials }
        client_id: { type: string }
        client_secret: { type: string, format: password }
        scope: { type: string }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        scope: { type: string }

    Introspection:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        sub: { type: string }
        scope: { type: string }
        exp: { type: integer }
        principal_type: { type: string, enum: [user, application, service] }

    Principal:
      type: object
      required: [id, type, global_roles, memberships]
      properties:
        id: { type: string }
        type: { type: string, enum: [user, application, service] }
        email: { type: string, format: email }
        display_name: { type: string }
        global_roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        memberships:
          type: array
          items:
            type: object
            required: [project_id, roles]
            properties:
              project_id: { type: string }
              roles: { type: array, items: { $ref: '#/components/schemas/Role' } }

    Role:
      type: string
      enum: [platform_admin, project_owner, project_editor, project_viewer, auditor]

    Pat:
      type: object
      required: [id, name, project_id, created_at, expires_at]
      properties:
        id: { type: string }
        name: { type: string }
        project_id: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }

    PatCreated:
      allOf:
        - $ref: '#/components/schemas/Pat'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The cleartext value. It cannot be recovered later.
