openapi: 3.1.0
info:
  title: AIA Inference Router
  version: '1.0.0'
  description: |
    The platform canonical inference API, compatible with OpenAI.

    The consumer picks an ALIAS, never a provider. Which provider serves the
    call (OpenAI, Gemini, Anthropic, Ollama) is the router's decision, subject to
    the project data classification (ADR-010). Swapping providers does not change
    a line in the consuming application.
  license: { name: MIT }

servers:
  - url: http://localhost:8080
    description: Local environment (docker-compose)

security:
  - bearerAuth: []

tags:
  - name: inference
    description: Chat, embeddings and the alias catalogue

paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [inference]
      summary: Creates a chat completion
      description: |
        Compatible with OpenAI's `POST /v1/chat/completions`.

        With `stream: true` the response is Server-Sent Events with typed events,
        an incrementing `id` for reconnection and a heartbeat every 15 s.

        A request carrying `tools` never reads or writes the semantic cache: the
        same prompt with a different toolset is a different question, and a
        cached text answer would silently replace a tool call.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/ProjectId'
        - $ref: './_shared.yaml#/components/parameters/TraceParent'
        - $ref: './_shared.yaml#/components/parameters/RequestId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: Completion generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletion' }
            text/event-stream:
              schema:
                type: string
                description: |
                  Named events: `message.delta`, `run.finished`, `error`.
                  Each event carries an incrementing `id` and a JSON payload.
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '422':
          description: No deployment compatible with the project classification
          content:
            application/problem+json:
              schema: { $ref: './_shared.yaml#/components/schemas/ProblemDetails' }
        '429': { $ref: './_shared.yaml#/components/responses/TooManyRequests' }
        '503': { $ref: './_shared.yaml#/components/responses/ServiceUnavailable' }

  /v1/embeddings:
    post:
      operationId: createEmbeddings
      tags: [inference]
      summary: Generates embeddings
      parameters:
        - $ref: './_shared.yaml#/components/parameters/ProjectId'
        - $ref: './_shared.yaml#/components/parameters/TraceParent'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbeddingsRequest' }
      responses:
        '200':
          description: Embeddings generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingsResponse' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '429': { $ref: './_shared.yaml#/components/responses/TooManyRequests' }

  /v1/completions/{requestId}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/ProjectId'
      - name: requestId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: readCompletionRecord
      tags: [inference]
      summary: What one call recorded, including the content the project kept
      description: |
        The audit trail has existed since the first release and nothing could
        read it, so the only way to see what a call actually said was a database
        prompt. That is the missing half of every quality conversation: a trace
        can say a call took 2.4 seconds and cost 300 micros, and cannot say
        whether the answer was any good.

        Requires `project_owner` or `auditor`, unlike everything else here —
        this is one person reading what another person's conversation
        contained, not a caller using the platform.

        Content appears only if the project opted into capture, and only as it
        was REDACTED when written. `content_captured` distinguishes "this
        project does not keep content" from "there was nothing to keep": read
        as the same thing, they send somebody to change a setting that is
        already right.

        A record belonging to another project answers 404, never 403.
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionRecord' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }

  /v1/models:
    get:
      operationId: listModels
      tags: [inference]
      summary: Lists the aliases visible to the project
      description: |
        Returns only the aliases the project classification allows. An alias
        with no compatible deployment does not appear.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/ProjectId'
      responses:
        '200':
          description: Available aliases
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ModelAlias' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }

  /health/live:
    get:
      operationId: liveness
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, const: ok } }

  /health/ready:
    get:
      operationId: readiness
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Ready to receive traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: A critical dependency is unavailable
          content:
            application/problem+json:
              schema: { $ref: './_shared.yaml#/components/schemas/ProblemDetails' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: [string, 'null'] }
        name: { type: string }
        tool_call_id:
          type: string
          description: Which call this message answers. Required on a `tool` message.
        tool_calls:
          type: array
          description: |
            Present on an assistant message the model ended with
            `finish_reason: tool_calls`. Sent back unchanged on the next turn so
            the model can match each result to the call that produced it.
          items: { $ref: '#/components/schemas/ToolCall' }

    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id: { type: string }
        type: { type: string, const: function }
        function:
          type: object
          required: [name, arguments]
          properties:
            name: { type: string }
            arguments:
              type: string
              description: |
                A JSON document, as a string. It is the model that produced it,
                so it may not parse; the caller validates before executing.
        provider_state:
          type: string
          description: |
            Opaque state the provider requires back UNCHANGED on the next turn.

            Gemini returns a `thoughtSignature` beside every function call and
            rejects the following request with a 400 when it is missing. Send
            back whatever arrived here, verbatim; do not read it, store it
            longer than the conversation, or invent one. Absent for providers
            that need nothing echoed.

    ToolDefinition:
      type: object
      required: [type, function]
      properties:
        type: { type: string, const: function }
        function:
          type: object
          required: [name]
          properties:
            name: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
            description: { type: string }
            parameters:
              type: object
              description: JSON Schema for the arguments.
              additionalProperties: true

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: |
            An alias from the catalogue, not the provider model name.
            E.g. `chat-fast`, `chat-advanced`, `chat-local`.
          examples: [chat-fast]
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChatMessage' }
        stream: { type: boolean, default: false }
        max_tokens:
          type: integer
          minimum: 1
          description: Capped by the alias ceiling, even when the requested value is higher.
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        stop:
          type: array
          items: { type: string }
          maxItems: 4
        user: { type: string, description: An opaque identifier for the end user. }
        tools:
          type: array
          maxItems: 128
          description: |
            What the model may call. The platform does not run any of them: it
            reports the call and the caller executes it, which is what keeps
            aia-mcp-gateway's allow-list, risk and approval in the path.
          items: { $ref: '#/components/schemas/ToolDefinition' }
        tool_choice:
          description: |
            `auto` (the default when tools are present), `none`, `required`, or
            a specific function.
          oneOf:
            - type: string
              enum: [auto, none, required]
            - type: object
              required: [type, function]
              properties:
                type: { type: string, const: function }
                function:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
      additionalProperties: false

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }

    ChatCompletion:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer }
        model: { type: string, description: The requested alias. }
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason:
                type: [string, 'null']
                enum: [stop, length, content_filter, tool_calls, null]
        usage: { $ref: '#/components/schemas/Usage' }
        aia:
          $ref: '#/components/schemas/RoutingMetadata'

    RoutingMetadata:
      type: object
      description: |
        How the platform served the call. It is the data residency evidence for
        audit (ADR-010) and the diagnostic for the operator.
      properties:
        deployment_id: { type: string }
        provider: { type: string, enum: [openai, gemini, anthropic, ollama] }
        provider_model: { type: string }
        data_zone: { $ref: './_shared.yaml#/components/schemas/DataZone' }
        cost: { $ref: './_shared.yaml#/components/schemas/Money' }
        cache_hit: { type: boolean }
        policy_stale:
          type: boolean
          description: Policy served from cache because governance was down.
        budget_unverified:
          type: boolean
          description: Budget not verified because Redis was down.
        guardrails_unverified:
          type: boolean
          description: |
            The content reached the provider without being inspected, because
            aia-guardrails was unreachable or is not deployed. A project
            classified `restricted` never sees this: it is refused with
            `guardrail_unavailable` instead (ADR-026).
        attempts: { type: integer, description: How many deployments were tried. }

    EmbeddingsRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string, examples: [embedding-default] }
        input:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string }, minItems: 1, maxItems: 2048 }
        dimensions: { type: integer, minimum: 1 }
      additionalProperties: false

    EmbeddingsResponse:
      type: object
      required: [object, data, model]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            type: object
            required: [object, index, embedding]
            properties:
              object: { type: string, const: embedding }
              index: { type: integer }
              embedding: { type: array, items: { type: number } }
        model: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }
        aia: { $ref: '#/components/schemas/RoutingMetadata' }

    CompletionRecord:
      type: object
      required: [request_id, project_id, principal_id, alias, status, content_captured, occurred_at]
      properties:
        request_id: { type: string }
        project_id: { type: string }
        principal_id: { type: string }
        alias: { type: string }
        deployment_id: { type: string }
        provider: { type: string }
        data_zone: { type: string }
        status: { type: string }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        cost_micros: { type: integer, minimum: 0 }
        currency: { type: string }
        duration_ms: { type: integer, minimum: 0 }
        error_code: { type: [string, 'null'] }
        guardrails_unverified:
          type: boolean
          description: The content left without being inspected (ADR-026).
        content_captured:
          type: boolean
          description: |
            Whether this project keeps conversation content at all. False means
            `prompt` and `completion` are null BY POLICY, not because the call
            said nothing.
        prompt:
          type: [string, 'null']
          description: Redacted when it was written, never at read time.
        completion: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: |
            When this record disappears. Per document, because retention is a
            project decision (reference doc 02 §10.2).

    ModelAlias:
      type: object
      required: [id, object, capabilities]
      properties:
        id: { type: string, examples: [chat-fast] }
        object: { type: string, const: model }
        description: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: [chat, embeddings, vision, tools] }
        max_output_tokens: { type: integer }
        data_zones:
          type: array
          description: Zones where this alias can be served for this project.
          items: { $ref: './_shared.yaml#/components/schemas/DataZone' }
        deprecated_at:
          type: [string, 'null']
          format: date-time
          description: Deprecation announced. The alert fires 60 days ahead.

    Readiness:
      type: object
      required: [status, dependencies]
      properties:
        status: { type: string, enum: [ok, degraded] }
        dependencies:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, degraded, down] }
              detail: { type: string }
