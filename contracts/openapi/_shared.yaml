# Components shared by every platform contract.
# Referenced as: $ref: './_shared.yaml#/components/schemas/ProblemDetails'
openapi: 3.1.0
info:
  title: AIA - shared components
  version: '1.0.0'
paths: {}
components:
  parameters:
    ProjectId:
      name: X-Project-Id
      in: header
      required: true
      description: |
        Project is the platform tenant. Required on every contract, every event,
        every trace and every partition key (reference doc 02, principle 2).
      schema: { type: string, minLength: 1, maxLength: 64 }
    TraceParent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context, for end-to-end correlation.
      schema: { type: string }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Required on any non-streaming POST that creates a resource or consumes
        budget. The result is cached for 24 h, under a key composed with project_id.
      schema: { type: string, minLength: 8, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor. Never interpret its contents.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457. `code` is stable and part of the public contract.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - budget_exhausted
            - quota_exceeded
            - concurrency_limit
            - no_compatible_deployment
            - alias_not_found
            - provider_unavailable
            - all_deployments_failed
            - stream_interrupted
            - guardrail_blocked
            - guardrail_unavailable
            - prompt_injection_suspected
            - unauthenticated
            - forbidden
            - token_expired
            - invalid_token
            - project_required
            - project_not_found
            - validation_failed
            - idempotency_conflict
            - not_found
            - conflict
            - asset_not_found
            - asset_not_published
            - asset_version_conflict
            - store_not_found
            - document_not_found
            - unsupported_media_type
            - embedding_dimension_mismatch
            - ingestion_failed
            - tool_not_found
            - tool_not_allowed
            - tool_arguments_invalid
            - tool_rate_limited
            - approval_required
            - tool_execution_failed
            - agent_step_limit
            - upstream_timeout
            - circuit_open
            - internal_error
        trace_id: { type: string }
        retry_after: { type: integer, description: Seconds until a retry is worth attempting. }
      additionalProperties: true

    DataClassification:
      type: string
      description: |
        The project data classification. It conditions which zones model routing
        may send the content to (ADR-010).
      enum: [public, internal, confidential, restricted]

    DataZone:
      type: string
      description: |
        Where the provider processes the data. `local` is Ollama on this machine.
      enum: [local, br, us, eu, global]

    Money:
      type: object
      description: A monetary amount in micros, to avoid floating point.
      required: [currency, micros]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3, examples: [BRL, USD] }
        micros:
          type: integer
          format: int64
          description: 1 unit of the currency = 1,000,000 micros.

    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        next_cursor:
          type: [string, 'null']
          description: Absent or null when there are no more pages.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Access denied
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    TooManyRequests:
      description: Budget, quota or concurrency exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ServiceUnavailable:
      description: Dependency unavailable or circuit open
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT issued by aia-identity or by a configured external OIDC.
