openapi: 3.1.0
info:
  title: AIA Guardrails
  version: '1.0.0'
  description: |
    Replaces a managed content safety service with open source parts: Presidio
    for PII detection and redaction (with recognisers for CPF, CNPJ, card, bank
    branch and account), prompt injection heuristics (OWASP LLM01) and,
    optionally, a local classifier through Ollama.
  license: { name: MIT }

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /v1/guardrails/analyze:
    post:
      operationId: analyzeContent
      summary: Analyses content without changing it
      parameters:
        - $ref: './_shared.yaml#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyzeRequest' }
      responses:
        '200':
          description: The analysis result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyzeResponse' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }

  /v1/guardrails/redact:
    post:
      operationId: redactContent
      summary: Analyses and returns the content with its PII replaced
      description: |
        Called before any content is persisted (reference doc 02 §10.2): the raw
        text never leaves the request flow.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedactRequest' }
      responses:
        '200':
          description: The redacted content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedactResponse' }
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }

  /health/live:
    get:
      operationId: liveness
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /health/ready:
    get:
      operationId: readiness
      security: []
      summary: Readiness probe
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AnalyzeRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 1000000 }
        language: { type: string, default: pt, enum: [pt, en] }
        entities:
          type: array
          description: Restricts the search to these entities. Empty = every known one.
          items: { $ref: '#/components/schemas/EntityType' }
        check_injection: { type: boolean, default: true }
      additionalProperties: false

    EntityType:
      type: string
      enum:
        - BR_CPF
        - BR_CNPJ
        - BR_RG
        - BR_BANK_ACCOUNT
        - CREDIT_CARD
        - IBAN_CODE
        - EMAIL_ADDRESS
        - PHONE_NUMBER
        - PERSON
        - LOCATION
        - IP_ADDRESS
        - DATE_TIME
        - URL

    Finding:
      type: object
      required: [entity_type, start, end, score]
      properties:
        entity_type: { $ref: '#/components/schemas/EntityType' }
        start: { type: integer }
        end: { type: integer }
        score: { type: number, minimum: 0, maximum: 1 }

    InjectionSignal:
      type: object
      required: [rule, score]
      properties:
        rule: { type: string, examples: [ignore_previous_instructions] }
        score: { type: number, minimum: 0, maximum: 1 }
        excerpt:
          type: string
          description: The short excerpt that fired the rule, already truncated.

    AnalyzeResponse:
      type: object
      required: [findings, injection, decision]
      properties:
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        injection:
          type: object
          required: [suspected, signals]
          properties:
            suspected: { type: boolean }
            score: { type: number }
            signals: { type: array, items: { $ref: '#/components/schemas/InjectionSignal' } }
        decision: { type: string, enum: [allow, redact, block] }

    RedactRequest:
      allOf:
        - $ref: '#/components/schemas/AnalyzeRequest'
        - type: object
          properties:
            strategy:
              type: string
              enum: [replace, mask, hash]
              default: replace
              description: |
                `replace` swaps in `<BR_CPF>`; `mask` keeps the last digits;
                `hash` allows correlating occurrences without revealing the value.

    RedactResponse:
      type: object
      required: [text, findings, decision]
      properties:
        text: { type: string }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        redacted_count: { type: integer }
        injection:
          type: object
          properties:
            suspected: { type: boolean }
            score: { type: number }
        decision: { type: string, enum: [allow, redact, block] }
