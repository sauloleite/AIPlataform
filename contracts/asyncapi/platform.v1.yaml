asyncapi: 3.0.0
info:
  title: AIA Platform - events
  version: '1.0.0'
  description: |
    Business events of the platform. CloudEvents 1.0 envelope, `subject` always
    carrying the `project_id` and `traceparent` as an extension, so the trace
    crosses the asynchronous boundary.

    Transport: Redis Streams, one stream per event type, with consumer groups and
    explicit ack (ADR-008 in the OSS version). Producers use the outbox pattern;
    consumers are idempotent.

    A breaking payload change creates a NEW `type` with a version suffix.
    Deprecation carries a minimum notice of 90 days.

servers:
  redis:
    host: redis:6379
    protocol: redis
    description: Redis Streams (local and self-hosted)

defaultContentType: application/json

channels:
  usageRecorded:
    address: 'aia:events:aia.inference.usage.recorded.v1'
    description: An inference call finished and consumed budget.
    messages:
      UsageRecorded:
        $ref: '#/components/messages/UsageRecorded'

  projectCreated:
    address: 'aia:events:aia.governance.project.created.v1'
    messages:
      ProjectCreated:
        $ref: '#/components/messages/ProjectCreated'

  budgetChanged:
    address: 'aia:events:aia.governance.budget.changed.v1'
    messages:
      BudgetChanged:
        $ref: '#/components/messages/BudgetChanged'

  assetPublished:
    address: 'aia:events:aia.registry.asset.published.v1'
    description: |
      A definition was frozen as an immutable version. Runtimes pin a published
      version for the length of a run, so this is what tells a cache that a new
      one is available -- never that a running one changed.
    messages:
      AssetPublished:
        $ref: '#/components/messages/AssetPublished'

  assetDeprecated:
    address: 'aia:events:aia.registry.asset.deprecated.v1'
    description: A published version was withdrawn.
    messages:
      AssetDeprecated:
        $ref: '#/components/messages/AssetDeprecated'

  toolInvoked:
    address: 'aia:events:aia.tools.tool.invoked.v1'
    description: |
      A tool ran. Published only on success -- a refusal is audited but is not
      a business fact anybody downstream acts on.
    messages:
      ToolInvoked:
        $ref: '#/components/messages/ToolInvoked'

  agentRunFinished:
    address: 'aia:events:aia.agent.run.finished.v1'
    description: |
      A run reached a terminal state. Published on failure too: a run that ends
      badly is exactly what an operator needs to hear about.
    messages:
      AgentRunFinished:
        $ref: '#/components/messages/AgentRunFinished'

  approvalRequested:
    address: 'aia:events:aia.agent.approval.requested.v1'
    description: |
      A run stopped on a high-risk tool and is waiting for a human (OWASP LLM06).
      It is what a notifier subscribes to: nobody is watching the console at 3am.
    messages:
      ApprovalRequested:
        $ref: '#/components/messages/ApprovalRequested'

  policyChanged:
    address: 'aia:events:aia.governance.policy.changed.v1'
    description: |
      The router listens to invalidate its local policy cache ahead of the TTL.
    messages:
      PolicyChanged:
        $ref: '#/components/messages/PolicyChanged'

  documentIngested:
    address: 'aia:events:aia.knowledge.document.ingested.v1'
    description: |
      A document finished ingestion and its chunks are searchable. Carries the
      chunk count because a document that ingested to zero chunks is a silent
      failure a consumer should be able to notice.
    messages:
      DocumentIngested:
        $ref: '#/components/messages/DocumentIngested'

  ingestionFailed:
    address: 'aia:events:aia.knowledge.ingestion.failed.v1'
    description: |
      Ingestion gave up on a document. Published rather than only logged: the
      uploader's console has no other way to learn that the upload it accepted
      minutes ago will never become searchable.
    messages:
      IngestionFailed:
        $ref: '#/components/messages/IngestionFailed'

  evaluationFinished:
    address: 'aia:events:aia.evaluation.run.finished.v1'
    description: |
      An evaluation run reached a terminal state. `errored` and `failed` are
      distinct (ADR-021): failed means the system scored below its threshold,
      errored means the run did not measure and has no verdict to report.
    messages:
      EvaluationFinished:
        $ref: '#/components/messages/EvaluationFinished'

operations:
  publishUsageRecorded:
    action: send
    channel: { $ref: '#/channels/usageRecorded' }
    summary: Published by aia-inference-router through the outbox.

  consumeUsageRecorded:
    action: receive
    channel: { $ref: '#/channels/usageRecorded' }
    summary: Consumed by aia-data-platform (Bronze) and by aia-governance.

  publishToolInvoked:
    action: send
    channel: { $ref: '#/channels/toolInvoked' }
    summary: Published by aia-mcp-gateway through the outbox.

  consumeToolInvoked:
    action: receive
    channel: { $ref: '#/channels/toolInvoked' }
    summary: Consumed by aia-data-platform for tool usage analytics.

  publishAssetPublished:
    action: send
    channel: { $ref: '#/channels/assetPublished' }
    summary: Published by aia-registry through the outbox.

  consumeAssetPublished:
    action: receive
    channel: { $ref: '#/channels/assetPublished' }
    summary: Consumed by aia-agent-runtime to invalidate its definition cache.

  publishAssetDeprecated:
    action: send
    channel: { $ref: '#/channels/assetDeprecated' }
    summary: Published by aia-registry through the outbox.

  publishAgentRunFinished:
    action: send
    channel: { $ref: '#/channels/agentRunFinished' }
    summary: Published by aia-agent-runtime through the outbox.

  consumeAgentRunFinished:
    action: receive
    channel: { $ref: '#/channels/agentRunFinished' }
    summary: Consumed by aia-data-platform for run analytics.

  publishApprovalRequested:
    action: send
    channel: { $ref: '#/channels/approvalRequested' }
    summary: Published by aia-agent-runtime when a run stops on a high-risk tool.

  publishPolicyChanged:
    action: send
    channel: { $ref: '#/channels/policyChanged' }
    summary: Published by aia-governance.

  publishDocumentIngested:
    action: send
    channel: { $ref: '#/channels/documentIngested' }
    summary: Published by the aia-knowledge ingestion worker through the outbox.

  publishIngestionFailed:
    action: send
    channel: { $ref: '#/channels/ingestionFailed' }
    summary: Published by the aia-knowledge ingestion worker after the last retry.

  publishEvaluationFinished:
    action: send
    channel: { $ref: '#/channels/evaluationFinished' }
    summary: Published by aia-evaluation when a run reaches a terminal state.

components:
  messages:
    UsageRecorded:
      name: UsageRecorded
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.inference.usage.recorded.v1' }
              data: { $ref: '#/components/schemas/UsageRecordedData' }

    ToolInvoked:
      name: ToolInvoked
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.tools.tool.invoked.v1' }
              data:
                type: object
                required: [tool_id, tool_type, risk_level, principal_id]
                properties:
                  tool_id: { type: string }
                  tool_type: { type: string, enum: [mcp, openapi, function, builtin] }
                  risk_level: { type: string, enum: [low, medium, high] }
                  principal_id:
                    type: string
                    description: Who the tool acted as. Never the gateway itself.
                  duration_ms: { type: integer, minimum: 0 }

    AgentRunFinished:
      name: AgentRunFinished
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.agent.run.finished.v1' }
              data:
                type: object
                required: [run_id, agent_id, agent_version, status, steps, principal_id]
                properties:
                  run_id: { type: string }
                  agent_id: { type: string }
                  agent_version:
                    type: integer
                    minimum: 1
                    description: The published version the run was pinned to.
                  thread_id: { type: string }
                  status: { type: string, enum: [completed, failed, cancelled] }
                  steps: { type: integer, minimum: 0 }
                  tool_calls: { type: integer, minimum: 0 }
                  principal_id: { type: string }
                  error_code: { type: [string, 'null'] }
                  duration_ms: { type: integer, minimum: 0 }

    ApprovalRequested:
      name: ApprovalRequested
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.agent.approval.requested.v1' }
              data:
                type: object
                required: [run_id, agent_id, tool_call_id, tool_name, risk_level, principal_id]
                properties:
                  run_id: { type: string }
                  agent_id: { type: string }
                  tool_call_id: { type: string }
                  tool_name: { type: string }
                  risk_level: { type: string, enum: [low, medium, high] }
                  principal_id:
                    type: string
                    description: Who started the run, not who will approve it.

    AssetPublished:
      name: AssetPublished
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.registry.asset.published.v1' }
              data:
                type: object
                required: [asset_id, kind, slug, version]
                properties:
                  asset_id: { type: string }
                  kind: { type: string, enum: [agent, tool, prompt] }
                  slug: { type: string }
                  version: { type: integer, minimum: 1 }

    AssetDeprecated:
      name: AssetDeprecated
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.registry.asset.deprecated.v1' }
              data:
                type: object
                required: [asset_id, kind, slug, version]
                properties:
                  asset_id: { type: string }
                  kind: { type: string, enum: [agent, tool, prompt] }
                  slug: { type: string }
                  version: { type: integer, minimum: 1 }

    ProjectCreated:
      name: ProjectCreated
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.governance.project.created.v1' }
              data:
                type: object
                required: [project_id, slug, data_classification]
                properties:
                  project_id: { type: string }
                  slug: { type: string }
                  name: { type: string }
                  data_classification: { type: string }
                  owner_principal_id: { type: string }

    BudgetChanged:
      name: BudgetChanged
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.governance.budget.changed.v1' }
              data:
                type: object
                required: [project_id, limit_micros, currency, period]
                properties:
                  project_id: { type: string }
                  limit_micros: { type: integer }
                  currency: { type: string }
                  period: { type: string, enum: [daily, monthly] }
                  block_at_limit: { type: boolean }

    PolicyChanged:
      name: PolicyChanged
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.governance.policy.changed.v1' }
              data:
                type: object
                required: [project_id, version]
                properties:
                  project_id: { type: string }
                  version: { type: integer }

    DocumentIngested:
      name: DocumentIngested
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.knowledge.document.ingested.v1' }
              data:
                type: object
                required: [store_id, document_id, chunk_count]
                properties:
                  store_id: { type: string }
                  document_id: { type: string }
                  chunk_count:
                    type: integer
                    minimum: 0
                    description: |
                      Zero is a legitimate value and a bad sign: the document
                      parsed to nothing. Consumers should treat it as such.

    IngestionFailed:
      name: IngestionFailed
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.knowledge.ingestion.failed.v1' }
              data:
                type: object
                required: [store_id, document_id, error_code]
                properties:
                  store_id: { type: string }
                  document_id: { type: string }
                  error_code:
                    type: string
                    description: |
                      A stable code from the @aia/errors catalogue, never a
                      provider message: the reason travels, the wording does not.

    EvaluationFinished:
      name: EvaluationFinished
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEventEnvelope'
          - type: object
            properties:
              type: { const: 'aia.evaluation.run.finished.v1' }
              data:
                type: object
                required: [run_id, suite, status]
                properties:
                  run_id: { type: string }
                  suite: { type: string }
                  status: { type: string, enum: [passed, failed, errored] }
                  gated:
                    type: boolean
                    description: Whether this run blocks a merge or a release.

  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, type, source, id, time, subject, datacontenttype, data]
      properties:
        specversion: { type: string, const: '1.0' }
        type: { type: string }
        source: { type: string, examples: ['/aia/inference-router'] }
        id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        subject:
          type: string
          description: project_id. The tenant follows the event all the way to analytics.
        datacontenttype: { type: string, const: application/json }
        traceparent: { type: string, description: 'Extension: W3C trace context.' }
        idempotencykey: { type: string, description: 'Extension: deduplication at the consumer.' }
        data: { type: object }

    UsageRecordedData:
      type: object
      required:
        [
          request_id,
          project_id,
          principal_id,
          alias,
          provider,
          deployment_id,
          data_zone,
          prompt_tokens,
          completion_tokens,
          cost_micros,
          currency,
          status,
        ]
      properties:
        request_id: { type: string }
        project_id: { type: string }
        principal_id: { type: string }
        alias: { type: string }
        provider: { type: string, enum: [openai, gemini, anthropic, ollama] }
        provider_model: { type: string }
        deployment_id: { type: string }
        data_zone:
          type: string
          enum: [local, br, us, eu, global]
          description: Data residency evidence for audit (ADR-010).
        data_classification: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost_micros: { type: integer, description: The computed cost, in micros of the currency. }
        currency: { type: string }
        duration_ms: { type: integer }
        time_to_first_token_ms: { type: [integer, 'null'] }
        cache_hit: { type: boolean }
        status:
          type: string
          enum: [completed, partial, failed]
          description: |
            `partial` when the stream dropped before the end: the commit uses
            what was counted up to the cut and reconciliation adjusts it later.
        error_code: { type: [string, 'null'] }
        budget_unverified: { type: boolean }
        policy_stale: { type: boolean }
